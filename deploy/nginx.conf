# ZeroDash — nginx server block with the in-browser editor enabled.
#
# Needs nginx built with ngx_http_dav_module (official nginx Docker image, Debian/Ubuntu
# `nginx` and `nginx-extras`, Alpine `nginx` all include it; check: nginx -V 2>&1 | grep dav).
#
# One-time setup:
#   mkdir -p /srv/zerodash/user/data
#   chown nginx:nginx /srv/zerodash/user/data      # user is www-data on Debian/Ubuntu
#
# Only user/data/ is writable by the web server; everything else stays read-only.

server {
    listen 80;
    server_name _;

    root /srv/zerodash;
    index index.html;

    # Layout URLs such as /admin or /portrait fall back to the dashboard page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- config storage -------------------------------------------------------
    # GET is open (the dashboard reads it). PUT is what the editor's Save button
    # sends, so restrict it to people you trust: LAN/Tailscale ranges and/or a password.
    location /user/data/ {
        dav_methods PUT;                 # no DELETE/MOVE/COPY needed
        create_full_put_path off;
        dav_access user:rw group:r all:r;
        client_max_body_size 1m;
        client_body_temp_path /tmp/zerodash-put;   # must be writable by nginx

        add_header Cache-Control "no-store" always;
        default_type application/json;

        limit_except GET HEAD {
            # Option A (default): only these networks may write.
            allow 127.0.0.1;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 100.64.0.0/10;         # Tailscale
            deny  all;

            # Option B: require a password instead (delete the allow/deny lines above).
            #   htpasswd -c /etc/nginx/zerodash.htpasswd you
            # auth_basic "ZeroDash editor";
            # auth_basic_user_file /etc/nginx/zerodash.htpasswd;
        }
    }
}
