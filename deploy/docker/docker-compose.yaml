# Run ONE of the two servers:
#   docker compose --profile nginx up -d      # http://localhost:8080
#   docker compose --profile caddy up -d --build
#
# App code is mounted read-only; only ./user (your config.js, icons, data/dashboard.json) is writable.
# Run from this directory (deploy/docker).

services:
  zerodash-nginx:
    profiles: [nginx]
    image: nginx:stable-alpine          # includes ngx_http_dav_module
    ports: ["8080:80"]
    volumes:
      - ../..:/usr/share/nginx/html:ro
      - ../../user:/usr/share/nginx/html/user        # bind mount, read-write
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/zerodash.htpasswd:ro
    restart: unless-stopped

  zerodash-caddy:
    profiles: [caddy]
    build:
      context: .
      dockerfile: dockerfile.caddy
    ports: ["8080:80"]
    volumes:
      - ../..:/srv:ro
      - ../../user:/srv/user                         # bind mount, read-write
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
