# ZeroDash — nginx server block for the Docker image (mounted as /etc/nginx/conf.d/default.conf).
# In Docker the client IP is the bridge gateway, so an IP allowlist is meaningless: writes need a password.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /user/data/ {
        dav_methods PUT;
        create_full_put_path off;
        dav_access user:rw group:r all:r;
        client_max_body_size 1m;
        client_body_temp_path /tmp/zd-put;
        add_header Cache-Control "no-store" always;
        default_type application/json;

        limit_except GET HEAD {
            auth_basic "ZeroDash editor";
            auth_basic_user_file /etc/nginx/zerodash.htpasswd;
        }
    }
}
