# ZeroDash default nginx config (baked into the image).
# Override by mounting your own file at /etc/nginx/conf.d/default.conf (see DOCKER.md for what it must contain).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Always revalidate so edits show up on refresh (ETag/Last-Modified keep unchanged files cheap).
    add_header Cache-Control "no-cache" always;

    # /layout/<name> serves index.html, so its relative URLs (./main.js, ./core/...) resolve to
    # /layout/main.js, /layout/core/... -> map them back to the root.
    rewrite ^/layout/(.+\.[A-Za-z0-9]+)$ /$1 last;

    # SPA fallback: /<layoutName> and /layout/<layoutName> must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard config. GET is open; PUT is what the editor's Save button sends.
    # /etc/nginx/zerodash-write-auth.conf is generated at start-up: open by default,
    # or a login when ZERODASH_EDIT_PASSWORD is set.
    location /user/data/ {
        dav_methods PUT;
        dav_access user:rw group:r all:r;
        client_max_body_size 1m;
        default_type application/json;
        add_header Cache-Control "no-store" always;

        limit_except GET HEAD {
            include /etc/nginx/zerodash-write-auth.conf;
        }
    }
}
