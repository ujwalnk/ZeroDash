# ZeroDash default nginx config (baked into the image).
# Override by mounting your own file at /etc/nginx/conf.d/default.conf
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Always revalidate so edits to user/config.js show up on refresh.
    # (ETag/Last-Modified still make unchanged files a cheap 304.)
    add_header Cache-Control "no-cache" always;

    # /layout/<name> loads index.html, whose relative URLs (./main.js, ./core/...)
    # then resolve to /layout/main.js, /layout/core/... -> map them back to the root.
    rewrite ^/layout/(.+\.[A-Za-z0-9]+)$ /$1 last;

    # SPA fallback: /<layoutName> and /layout/<layoutName> must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
