# ZeroDash (nginx) - quick start
#   docker compose -f compose.nginx.yaml up -d      ->  http://localhost:8080
#
# Optional: copy .env.example to .env to set a password for saving.

services:
  zerodash:
    image: ghcr.io/<owner>/zerodash:latest-nginx    # replace <owner> with your GitHub user/org
    container_name: zerodash
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Optional. Empty = saving needs no password. Set = saving requires this password (stored hashed).
      ZERODASH_EDIT_PASSWORD: ${ZERODASH_EDIT_PASSWORD:-}
      ZERODASH_EDIT_USER: ${ZERODASH_EDIT_USER:-admin}
    volumes:
      # Your dashboard.json (+ backup) and optional icons live here.
      - zerodash-user:/usr/share/nginx/html/user
      # Prefer a visible folder? Use this instead (the container will chown ./user/data to the nginx user):
      # - ./user:/usr/share/nginx/html/user

      # Advanced: your own nginx config (see DOCKER.md for what it must contain)
      # - ./default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  zerodash-user:
